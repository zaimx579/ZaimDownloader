name: Build ZAIM Downloader APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'zaim-downloader-v3-github-apk.zip'
      - '.github/workflows/build-apk.yml'
      - 'trigger-build.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack Android project
        run: |
          test -f zaim-downloader-v3-github-apk.zip
          unzip -q zaim-downloader-v3-github-apk.zip
          test -f zaim-downloader-v3/gradlew
          chmod +x zaim-downloader-v3/gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build release APK
        working-directory: zaim-downloader-v3
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Verify APK exists
        run: |
          APK=$(find zaim-downloader-v3/app/build/outputs/apk/release -name '*.apk' | head -1)
          test -n "$APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZAIM-Downloader-APK
          path: ${{ env.APK_PATH }}
          retention-days: 90
